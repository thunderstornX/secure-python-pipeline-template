name: PR Quick Check

# Lightweight gate that runs on every PR before the heavier security.yml.
# Goal: < 90 seconds to a developer-actionable signal (Bandit + pip-audit only).

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.py"
      - "**/requirements*.txt"
      - "pyproject.toml"
      - "bandit.yml"

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Cancel in-flight runs when a new commit lands on the same PR.
  group: pr-check-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  bandit:
    name: "Bandit (changed files only)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Bandit
        run: pip install bandit==1.8.6

      # Use tj-actions/changed-files: handles fork PRs and exotic filenames
      # (with spaces, NUL-safe enumeration) correctly.
      - name: Compute changed Python files
        id: changed
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.py

      - name: Run Bandit on changed files
        if: steps.changed.outputs.any_changed == 'true'
        env:
          CHANGED: ${{ steps.changed.outputs.all_changed_files }}
        run: |
          # CHANGED is a space-separated list; quote each filename via xargs.
          # shellcheck disable=SC2086
          echo "$CHANGED" | xargs -r bandit -c bandit.yml --severity-level medium

  pip-audit:
    name: "pip-audit (dependency CVEs)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit==2.10.0

      - name: Audit top-level requirements
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt
          else
            echo "No top-level requirements.txt; skipping."
          fi
